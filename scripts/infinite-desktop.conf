# Infinite floating-window canvas. Only floating, non-pinned Hyprland clients
# in the active workspace participate. Layer-shell widgets are not clients.

# These unbinds make the package work with the stock Hyprland arrow and scroll
# bindings without editing the user's main configuration.
unbind = SUPER, Z
unbind = SUPER, left
unbind = SUPER, right
unbind = SUPER, up
unbind = SUPER, down
unbind = SUPER, mouse_down
unbind = SUPER, mouse_up

# Enable or disable the canvas. Navigation and pan work only while enabled.
bind = SUPER, Z, exec, infinite-desktop toggle

# Super + arrows navigates the canvas. With it disabled, the helper falls back
# to Hyprland's normal directional focus.
bind = SUPER, left, exec, infinite-desktop focus left
bind = SUPER, right, exec, infinite-desktop focus right
bind = SUPER, up, exec, infinite-desktop focus up
bind = SUPER, down, exec, infinite-desktop focus down

# Recenter the active floating window after a focus change made outside the canvas.
bind = CTRL SUPER, C, exec, infinite-desktop center

# Keyboard pan: shift the entire canvas 180px in the requested viewpoint direction.
bind = CTRL SUPER ALT, left, exec, infinite-desktop pan left
bind = CTRL SUPER ALT, right, exec, infinite-desktop pan right
bind = CTRL SUPER ALT, up, exec, infinite-desktop pan up
bind = CTRL SUPER ALT, down, exec, infinite-desktop pan down

# Drag the complete canvas. Super+Alt+LMB is a shell fallback that works
# everywhere and needs pointer read access (normally group `input`).
# Velora Shell handles RMB over the empty desktop directly through Quickshell.
bind = SUPER ALT, mouse:272, exec, infinite-desktop drag

# Spread the current floating windows into a useful initial canvas.
bind = CTRL SUPER, S, exec, infinite-desktop scatter

# Activate the canvas if needed and arrange its windows organically without overlap.
bind = SUPER ALT, Z, exec, infinite-desktop scatter-random

# Optional: reverse both keyboard and pointer panning direction.
bind = CTRL SUPER, I, exec, infinite-desktop invert

# Super + wheel zooms the canvas while it is active. Otherwise it keeps the
# normal open-workspace navigation behaviour.
bind = SUPER, mouse_down, exec, infinite-desktop zoom out
bind = SUPER, mouse_up, exec, infinite-desktop zoom in
